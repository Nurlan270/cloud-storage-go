version: "2"

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - tagalign
    - dupl
    - dogsled
    - gocyclo
    - godot
    - wsl_v5
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Listener).Close
        - (*net/rpc.Client).Close
      verbose: false
    gocyclo:
      min-complexity: 12
    godot:
      scope: declarations
      exclude:
        - "(?i)^todo:"
      period: true
      capital: true
    wsl_v5:
      default: default
      branch-max-lines: 2
      case-max-lines: 0

formatters:
  enable:
    - gci
    - golines
    - gofmt
  settings:
    gci:
      no-inline-comments: true
      no-prefix-comments: true
      no-lex-order: false
      sections:
        - standard
        - default
        - localmodule
        - alias
        - dot
        - blank
      custom-order: true
    golines:
      max-len: 110
      tab-len: 4
      shorten-comments: true
      reformat-tags: true
      chain-split-dots: false

output:
  sort-order:
    - severity
    - linter
    - file
  show-stats: true

issues:
  max-same-issues: 0
  fix: true

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true
  concurrency: 4