root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/cloud_storage ./cmd/cloud_storage"
  entrypoint = "tmp/cloud_storage"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "logs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "0s"

[log]
  time = false
