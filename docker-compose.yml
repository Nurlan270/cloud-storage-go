services:
  cloud_storage:
    container_name: cloud_storage
    build:
      context: .
      dockerfile: docker/go/cloud_storage/Dockerfile
      target: dev
    volumes:
      - .:/app
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth_server:
        condition: service_started
      nginx:
        condition: service_started
    networks:
      - app_network
    restart: on-failure

  auth_server:
    container_name: auth_server
    build:
      context: .
      dockerfile: docker/go/auth_server/Dockerfile
      target: dev
    volumes:
      - .:/app
    expose:
      - "7070"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: on-failure

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app_network
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:8.4-alpine
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--appendonly", "yes"
    ]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app_network
    restart: unless-stopped

  minio:
    container_name: minio
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER} # Min. 3 chars long
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD} # Min. 8 chars long
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    restart: unless-stopped


volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  app_network:
